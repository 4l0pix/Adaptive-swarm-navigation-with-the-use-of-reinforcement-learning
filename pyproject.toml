[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-nav"
version = "0.6.0"
description = "Composable simulation tools for adaptive swarm navigation research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
web = ["Flask>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["swarm_nav*", "simulation"]
namespaces = false

[tool.setuptools.package-data]
simulation = ["templates/*.html", "static/js/*.js"]
